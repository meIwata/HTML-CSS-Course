<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <title>Carousel Component</title>
    <style>
        /*
        SPACING SYSTEM (px)
        2 / 4 / 8 / 12 / 16 / 24 / 32 / 48 / 64 / 80 / 96 / 128

        FONT SIZE SYSTEM (px)
        10 / 12 / 14 / 16 / 18 / 20 / 24 / 30 / 36 / 44 / 52 / 62 / 74 / 86 / 98
        */

        /* 
        參考配色: https://yeun.github.io/open-color/#green 
        查看對比色彩: https://coolors.co/contrast-checker
        免費icon: https://heroicons.com/
        */

        /* 
        Main Color: #087f5b
        Grey Color: #343a40
        */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: #343a40;
            line-height: 1;
            /* 行高 */
        }

        .carousel {
            width: 800px;
            margin: 100px auto;
            /*上下100px, 左右自動 */
            background-color: #087f5b;
            padding: 32px; /* 內距*/
            padding-left: 86px; /* 左內距 */
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 86px;
        }

        img {
            height: 200px;
            border-radius: 8px;
            transform: scale(1.5); /* 放大圖片 */
            box-shadow: 0 12px 24px rgb(0 0 0 / 25%);
        }

        .testmonial-text {
            font-size: 18px;
            font-weight: 500;
            line-height: 1.5;
            margin-bottom: 32px;
            color: #e6fcf5;
        }

        .testmonial-author {
            font-size: 14px;
            margin-bottom: 4px;
            color: #c3fae8;
        }

        .testmonial-job {
            font-size: 12px;
            color: #c3fae8;
        }
    </style>
</head>

<body>
    <div class="carousel">
        <img src="maria.jpg" alt="Maria de Almeida" />
        <blockquote class="testmonial">
            <p class="testmonial-text">
                "Lorem ipsum dolor sit amet consectetur, adipisicing elit. Illum corrupti delectus nobis veniam harum
                accusantium, sit optio fugiat non itaque incidunt modi doloribus totam distinctio nam fuga ratione
                repellendus atque."
            </p>
            <p class="testmonial-author">Maria de Almeida</p>
            <p class="testmonial-job">Product Manager at EDP Comercial</p>
        </blockquote>
        <button class="btn"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="btn-icon">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
            </svg>
        </button>
        <button class="btn"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="btn-icon">
                <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
            </svg>
        </button>
    </div>
</body>

</html>
