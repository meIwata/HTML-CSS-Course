<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <title>Carousel Component</title>
    <style>
        /*
        SPACING SYSTEM (px)
        2 / 4 / 8 / 12 / 16 / 24 / 32 / 48 / 64 / 80 / 96 / 128

        FONT SIZE SYSTEM (px)
        10 / 12 / 14 / 16 / 18 / 20 / 24 / 30 / 36 / 44 / 52 / 62 / 74 / 86 / 98
        */

        /* 
        參考配色: https://yeun.github.io/open-color/#green 
        查看對比色彩: https://coolors.co/contrast-checker
        免費icon: https://heroicons.com/
        */

        /* 
        Main Color: #087f5b
        Grey Color: #343a40
        */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: #343a40;
            line-height: 1;
            /* 行高 */
        }

        .carousel {
            width: 800px;
            margin: 100px auto;
            /*上下100px, 左右自動 */
            background-color: #087f5b;
            /* padding: 32px;
            padding-left: 86px;
            padding-right: 48px; */
            padding: 32px 48px 32px 86px; /* 上右下左 */
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 86px;
            position: relative;
            /* 讓子元素可以絕對定位 */
        }

        img {
            height: 200px;
            border-radius: 8px;
            transform: scale(1.5);
            /* 放大圖片 */
            box-shadow: 0 12px 24px rgb(0 0 0 / 25%);
        }

        .testmonial-text {
            font-size: 18px;
            font-weight: 500;
            line-height: 1.5;
            margin-bottom: 32px;
            color: #e6fcf5;
        }

        .testmonial-author {
            font-size: 14px;
            margin-bottom: 4px;
            color: #c3fae8;
        }

        .testmonial-job {
            font-size: 12px;
            color: #c3fae8;
        }

        .btn {
            background-color: #fff;
            border: none;
            height: 40px;
            width: 40px;
            border-radius: 50%;
            position: absolute;
            /*把元素抽出來，浮在在上面 */
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.25);
            cursor: pointer;
            /* 游標變成手指 */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn--left {
            /* 這跟父元素的position: relative;有關 */
            left: 0;
            /* 左邊距0px */
            top: 50%;

            /* 50%是父元素的高度，這樣就可以置中 */
            transform: translate(-50%, -50%);
        }

        .btn--right {
            right: 0;
            /* 右邊距0px */
            top: 50%;
            transform: translate(50%, -50%);
        }

        .btn-icon {
            height: 24px;
            width: 24px;
            stroke: #087f5b;
        }

        .dots {
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translate(-50%, 32px);
            display: flex;
            /* 讓他左右排列 */
            gap: 12px;
        }

        .dot {
            height: 12px;
            width: 12px;
            background-color: #fff;
            border: 2px solid #087f5b;
            border-radius: 50%;
            cursor: pointer;
        }

        .dot--fill {
            background-color: #087f5b;
        }
    </style>
</head>

<body>
    <div class="carousel">
        <img src="maria.jpg" alt="Maria de Almeida" />
        <blockquote class="testmonial">
            <p class="testmonial-text">
                "Lorem ipsum dolor sit amet consectetur, adipisicing elit. Illum corrupti delectus nobis veniam harum
                accusantium, sit optio fugiat non itaque incidunt modi doloribus totam distinctio nam fuga ratione
                repellendus atque."
            </p>
            <p class="testmonial-author">Maria de Almeida</p>
            <p class="testmonial-job">Product Manager at EDP Comercial</p>
        </blockquote>
        <button class="btn btn--left"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke-width="1.5" stroke="currentColor" class="btn-icon">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
            </svg>
        </button>
        <button class="btn btn--right"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke-width="1.5" stroke="currentColor" class="btn-icon">
                <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
            </svg>
        </button>
        <div class="dots">
            <div class="dot dot--fill">&nbsp;</div> <!-- 這裡的&nbps;是空白字元 -->
            <div class="dot">&nbsp;</div>
            <div class="dot">&nbsp;</div>
            <div class="dot">&nbsp;</div>
        </div>
    </div>
</body>

</html>
