<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <title>Accordion Component</title>
    <style>
        /*
        SPACING SYSTEM (px)
        2 / 4 / 8 / 12 / 16 / 24 / 32 / 48 / 64 / 80 / 96 / 128

        FONT SIZE SYSTEM (px)
        10 / 12 / 14 / 16 / 18 / 20 / 24 / 30 / 36 / 44 / 52 / 62 / 74 / 86 / 98
        */

        /* 
        參考配色: https://yeun.github.io/open-color/#green 
        查看對比色彩: https://coolors.co/contrast-checker
        免費icon: https://heroicons.com/
        */

        /* 
        Main Color: #087f5b
        Grey Color: #343a40
        */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: #343a40;
            line-height: 1;            /* 行高 */
            display: flex;
            justify-content: center;
        }
        table{
            width: 800px;
            margin-top: 100px;
            /* border: 1px solid #343a40; */
            font-size: 18px;
            border-collapse: collapse; /* 讓邊框合併在一起 */
        }
        td, th{
            /* border: 1px solid #343a40; */
            padding: 16px 24px; /* 上下16px，左右24px */
            text-align: left; /* 置左對齊 */
        }
        thead th{
            background-color: #087f5b;
            color: #fff; /* 白色字體 */
            width: 25%;
        }
        tbody tr:nth-child(odd) {/* 奇數行 */
            background-color: #f8f9fa; 
        }
        tbody tr:nth-child(even) {/* 偶數行 */
            background-color: #e9ecef; 
        }
    </style>
</head>

<body>
    <table>
        <thead>
            <tr>
                <th>Chair</th> <!--th是表頭的意思-->
                <th>The Laid Back</th>
                <th>The Worker Bee</th>
                <th>THe Chair 4/2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th>Width</tㄘ>
                <td>80 cm</td>
                <td>60 cm</td>
                <td>220 cm</td>
            </tr>
            <tr>
                <th>Height</th>
                <td>100 cm</td>
                <td>110 cm</td>
                <td>90 cm</td>
            </tr>
            <tr>
                <th>Depth</th>
                <td>70 cm</td>
                <td>65 cm</td>
                <td>80 cm</td>
            </tr>
            <tr>
                <th>Weight</th>
                <td>16 kg</td>
                <td>22 kg</td>
                <td>80 kg</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
